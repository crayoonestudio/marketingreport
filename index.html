<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketing CRM BTS</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Chart.js for Funnel Chart -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Custom Utilities -->
    <style>
        /* Custom scrollbar for Kanban and Tables */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }
        
        .toast-enter {
            transform: translateY(100%);
            opacity: 0;
            animation: slideUp 0.3s forwards ease-out;
        }
        
        @keyframes slideUp {
            to { transform: translateY(0); opacity: 1; }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased overflow-hidden">
    
    <!-- Container Utama Aplikasi -->
    <div id="app-root" class="h-screen w-full flex flex-col"></div>
    
    <!-- Container untuk Toast Notifications -->
    <div id="toast-container" class="fixed bottom-5 right-5 z-[9999] flex flex-col gap-3"></div>

    <!-- Container untuk Modals -->
    <div id="modal-container"></div>

    <script type="module">
        // Firebase Modular SDK imports
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, onSnapshot, addDoc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // Constants
        const STAGES = ['Canvassing', 'Follow Up', 'Presentasi', 'Negosiasi', 'Deal', 'Belum Deal'];
        const CATEGORIES = ['🔥 Hot', '🌤️ Warm', '❄️ Cold'];
        const MONTHS = [
            { value: 1, label: 'Januari' }, { value: 2, label: 'Februari' }, { value: 3, label: 'Maret' },
            { value: 4, label: 'April' }, { value: 5, label: 'Mei' }, { value: 6, label: 'Juni' },
            { value: 7, label: 'Juli' }, { value: 8, label: 'Agustus' }, { value: 9, label: 'September' },
            { value: 10, label: 'Oktober' }, { value: 11, label: 'November' }, { value: 12, label: 'Desember' }
        ];

        // Global Application State (Dengan Fallback Akun Default)
        const defaultUsers = [
            { id: 'local-1', name: 'Budi Owner', role: 'owner', username: 'owner', status: 'aktif', wilayah: 'Semua Wilayah', email: 'owner@bts.id', phone: '08123456781' },
            { id: 'local-2', name: 'Siti HR', role: 'hr', username: 'hr', status: 'aktif', wilayah: 'Semua Wilayah', email: 'hr@bts.id', phone: '08123456782' },
            { id: 'local-3', name: 'Andi Marketing', role: 'marketing', username: 'andi', status: 'aktif', wilayah: 'Bogor & Depok', email: 'andi@bts.id', phone: '08123456783' }
        ];

        const state = {
            firebaseUser: null,
            appUser: null,
            users: [...defaultUsers], // Terisi otomatis agar tidak stuck di halaman login
            schools: [],
            activities: [],
            settings: {
                targetDatabase: 50, targetCanvassing: 100, targetFollowUp: 50, targetPresentasi: 20, strictIsolation: true
            },
            activeTab: 'dashboard',
            sidebarOpen: false,
            isOnline: navigator.onLine,
            isSyncing: false,
            currentDate: new Date('2026-07-26T20:55:26+07:00'), // As requested
            selectedYear: 2026,
            selectedMonth: 7,
            chartInstance: null,
            searchStaff: ''
        };

        // Initialize Firebase
        const firebaseConfig = typeof window.__firebase_config !== 'undefined' ? JSON.parse(window.__firebase_config) : {};
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof window.__app_id !== 'undefined' ? window.__app_id : 'crm-bts-demo-html';
        const publicPath = `artifacts/${appId}/public/data`;

        // Expose handlers to window so inline HTML onclick attributes can reach them
        window.h = {}; 

        // Helper: Formatting Currency
        const formatCurrency = (amount) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(amount || 0);
        const toTitleCase = (str) => str ? str.replace(/\w\S*/g, (txt) => txt.charAt(0).toUpperCase() + txt.substr(1).toLowerCase()) : '';

        // Helper: Show Toast
        window.h.showToast = (message, type = 'info') => {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            let colorClasses = 'bg-slate-800 text-white border-slate-700';
            let icon = 'info';
            
            if (type === 'error') {
                colorClasses = 'bg-red-50 text-red-700 border-red-200';
                icon = 'alert-circle';
            } else if (type === 'success') {
                colorClasses = 'bg-emerald-50 text-emerald-700 border-emerald-200';
                icon = 'check-circle-2';
            }

            toast.className = `flex items-center gap-3 px-4 py-3 rounded-xl shadow-xl border text-sm font-semibold transition-all toast-enter ${colorClasses}`;
            toast.innerHTML = `
                <i data-lucide="${icon}" class="w-5 h-5 shrink-0 ${type === 'error' ? 'text-red-500' : type === 'success' ? 'text-emerald-500' : 'text-blue-400'}"></i>
                <span>${message}</span>
            `;
            container.appendChild(toast);
            lucide.createIcons();

            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(10px)';
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        };

        
        // Computed Properties (Filters)
        const getFilteredSchools = () => {
            if (!state.appUser) return [];
            let filtered = state.schools;
            if (state.appUser.role === 'marketing' && state.settings.strictIsolation) {
                filtered = state.schools.filter(s => s.marketingId === state.appUser.id);
            }
            return filtered.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
        };

        const getFilteredActivities = () => {
            if (!state.appUser) return [];
            let filtered = state.activities;
            if (state.appUser.role === 'marketing') filtered = filtered.filter(a => a.marketingId === state.appUser.id);
            
            filtered = filtered.filter(a => {
                if (!a.date) return false;
                const date = new Date(a.date);
                return date.getFullYear() === state.selectedYear && (date.getMonth() + 1) === state.selectedMonth;
            });
            return filtered.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
        };

        // Core Render Engine
        const renderApp = () => {
            const root = document.getElementById('app-root');
            
            if (!state.appUser) {
                root.innerHTML = renderLoginScreen();
            } else {
                root.innerHTML = renderMainLayout();
                renderActiveTabContent();
            }
            lucide.createIcons();
        };

        const reRenderContentOnly = () => {
            renderActiveTabContent();
            renderHeaderUI();
            lucide.createIcons();
        };

        // Navigation Handlers
        window.h.login = (userId) => {
            const user = state.users.find(u => u.id === userId || u.username === userId);
            if (user && user.status === 'aktif') {
                state.appUser = user;
                window.h.showToast(`Selamat datang, ${user.name}!`, 'success');
                renderApp();
            } else {
                window.h.showToast('Username tidak ditemukan atau akun dinonaktifkan.', 'error');
            }
        };

        window.h.loginSubmit = (event) => {
            event.preventDefault();
            const username = document.getElementById('login-username').value.trim().toLowerCase();
            window.h.login(username);
        };

        window.h.logout = () => {
            state.appUser = null;
            state.activeTab = 'dashboard';
            window.h.showToast('Berhasil keluar dari sistem.', 'info');
            if (state.chartInstance) { state.chartInstance.destroy(); state.chartInstance = null; }
            renderApp();
        };

        window.h.switchTab = (tabId) => {
            state.activeTab = tabId;
            state.sidebarOpen = false;
            if (state.chartInstance) { state.chartInstance.destroy(); state.chartInstance = null; }
            renderApp();
        };

        window.h.toggleSidebar = () => {
            state.sidebarOpen = !state.sidebarOpen;
            renderApp();
        };

        // Period Filters
        window.h.changeYear = (val) => {
            state.selectedYear = parseInt(val);
            const currentMonthNum = state.currentDate.getMonth() + 1;
            if (state.selectedYear === state.currentDate.getFullYear() && state.selectedMonth < currentMonthNum) {
                state.selectedMonth = currentMonthNum;
            }
            reRenderContentOnly();
        };

        window.h.changeMonth = (val) => {
            state.selectedMonth = parseInt(val);
            reRenderContentOnly();
        };

        const renderLoginScreen = () => {
            const demoButtons = state.users.map(u => `
                <button type="button" onclick="window.h.login('${u.id || u.username}')" class="text-xs px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg font-medium transition border border-slate-200 shadow-sm">
                    ${u.name} (${u.role})
                </button>
            `).join('');

            return `
            <div class="min-h-screen bg-slate-100 flex items-center justify-center p-4 w-full h-full">
                <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-8 border border-slate-200">
                    <div class="text-center mb-8">
                        <div class="inline-flex items-center justify-center w-16 h-16 bg-blue-600 rounded-2xl mb-4 shadow-lg shadow-blue-500/20">
                            <i data-lucide="trending-up" class="text-white w-8 h-8"></i>
                        </div>
                        <h1 class="text-2xl font-bold text-slate-800">CRM Buku Tahunan</h1>
                        <p class="text-slate-500 text-sm mt-1">Marketing Reporting System</p>
                    </div>
                    <form onsubmit="window.h.loginSubmit(event)" class="space-y-5">
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Username Login</label>
                            <input id="login-username" type="text" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 outline-none text-sm transition" placeholder="Masukkan username..." required />
                        </div>
                        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 px-4 rounded-xl shadow-md transition duration-200 text-sm">
                            Masuk Aplikasi
                        </button>
                    </form>
                    <div class="mt-8 pt-6 border-t border-slate-200">
                        <p class="text-xs font-semibold text-slate-400 mb-3 text-center uppercase tracking-wider">Akses Demo Cepat:</p>
                        <div class="flex flex-wrap gap-2 justify-center">${demoButtons}</div>
                    </div>
                </div>
            </div>`;
        };

        const renderMainLayout = () => {
            const navItems = [
                { id: 'dashboard', label: 'Dashboard', icon: 'layout-dashboard', roles: ['owner', 'hr', 'marketing'] },
                { id: 'master', label: 'Data Master', icon: 'building-2', roles: ['owner', 'hr', 'marketing'] },
                { id: 'activity', label: 'Daily Activity', icon: 'file-text', roles: ['owner', 'hr', 'marketing'] },
                { id: 'pipeline', label: 'Pipeline', icon: 'briefcase', roles: ['owner', 'hr', 'marketing'] },
                { id: 'gps', label: 'Monitoring GPS', icon: 'map-pin', roles: ['owner', 'hr'] },
                { id: 'settings', label: 'Pengaturan', icon: 'settings', roles: ['owner', 'hr'] }
            ];

            const visibleNavs = navItems.filter(item => item.roles.includes(state.appUser.role));

            let sidebarHtml = visibleNavs.map(item => {
                const isActive = state.activeTab === item.id;
                const activeClasses = isActive ? 'bg-blue-600 text-white shadow-md shadow-blue-600/30' : 'hover:bg-slate-800 hover:text-white text-slate-400';
                const iconColor = isActive ? 'text-white' : 'text-slate-400';
                return `
                    <button onclick="window.h.switchTab('${item.id}')" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-xs font-bold transition-all ${activeClasses}">
                        <i data-lucide="${item.icon}" class="w-4 h-4 ${iconColor}"></i>
                        ${item.label}
                    </button>
                `;
            }).join('');

            return `
            <div class="flex h-screen w-full bg-slate-50 overflow-hidden relative">
                <!-- Mobile Sidebar Overlay -->
                ${state.sidebarOpen ? `<div class="fixed inset-0 bg-black/50 z-40 lg:hidden" onclick="window.h.toggleSidebar()"></div>` : ''}

                <!-- Sidebar -->
                <aside class="fixed lg:static inset-y-0 left-0 z-50 w-64 bg-slate-900 text-slate-300 transition-transform duration-300 ease-in-out ${state.sidebarOpen ? 'translate-x-0' : '-translate-x-full lg:translate-x-0'} flex flex-col h-full">
                    <div class="p-5 flex items-center gap-3 border-b border-slate-800">
                        <div class="w-8 h-8 bg-blue-600 rounded-xl flex items-center justify-center shadow-md shadow-blue-500/20">
                            <i data-lucide="trending-up" class="text-white w-5 h-5"></i>
                        </div>
                        <span class="text-white font-bold text-base tracking-wide">CRM BTS</span>
                    </div>
                    <nav class="flex-1 px-3 py-4 space-y-1 overflow-y-auto">${sidebarHtml}</nav>
                    <div class="p-4 border-t border-slate-800">
                        <button onclick="window.h.logout()" class="w-full flex items-center gap-3 px-3 py-2.5 text-xs font-bold text-slate-400 hover:text-white hover:bg-slate-800 rounded-xl transition">
                            <i data-lucide="log-out" class="w-4 h-4"></i> Keluar Akun
                        </button>
                    </div>
                </aside>

                <!-- Main Content Wrapper -->
                <div class="flex-1 flex flex-col min-w-0 h-screen overflow-hidden">
                    <header id="main-header" class="bg-white border-b border-slate-200 sticky top-0 z-30 px-4 sm:px-6 py-3 flex items-center justify-between shadow-sm"></header>
                    <main id="main-content" class="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8 relative"></main>
                </div>
            </div>`;
        };

        const renderHeaderUI = () => {
            const header = document.getElementById('main-header');
            if (!header) return;

            const currentMonthNum = state.currentDate.getMonth() + 1;
            
            const monthOptions = MONTHS.map(m => {
                let isDisabled = (state.selectedYear === 2026 && m.value < currentMonthNum);
                return `<option value="${m.value}" ${state.selectedMonth === m.value ? 'selected' : ''} ${isDisabled ? 'disabled' : ''}>${m.label} ${isDisabled ? '(Terkunci)' : ''}</option>`;
            }).join('');

            const syncStatusClasses = !state.isOnline ? 'bg-red-50 text-red-600 border border-red-200' :
                                      state.isSyncing ? 'bg-amber-50 text-amber-700 border border-amber-200' : 'bg-emerald-50 text-emerald-700 border border-emerald-200';
            
            const syncStatusIcon = !state.isOnline ? 'wifi-off' : state.isSyncing ? 'refresh-cw' : 'check-circle-2';
            const syncStatusText = !state.isOnline ? 'Offline' : state.isSyncing ? 'Menyinkronkan...' : 'Real-Time Sync';

            header.innerHTML = `
                <div class="flex items-center gap-3">
                    <button onclick="window.h.toggleSidebar()" class="lg:hidden p-2 rounded-lg hover:bg-slate-100 text-slate-600">
                        <i data-lucide="menu" class="w-5 h-5"></i>
                    </button>
                    <div class="flex flex-wrap items-center gap-2">
                        <div class="hidden sm:flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-semibold ${syncStatusClasses}">
                            <i data-lucide="${syncStatusIcon}" class="w-3.5 h-3.5 ${state.isSyncing ? 'animate-spin' : ''}"></i>
                            <span>${syncStatusText}</span>
                        </div>
                        <div class="flex items-center bg-slate-100 rounded-lg p-1">
                            <i data-lucide="calendar" class="w-4 h-4 text-slate-500 ml-2"></i>
                            <select onchange="window.h.changeYear(this.value)" class="bg-transparent text-xs font-bold text-slate-700 p-1 outline-none cursor-pointer">
                                <option value="2026" ${state.selectedYear === 2026 ? 'selected' : ''}>2026</option>
                                <option value="2027" ${state.selectedYear === 2027 ? 'selected' : ''}>2027</option>
                            </select>
                        </div>
                        <div class="flex items-center bg-slate-100 rounded-lg p-1">
                            <select onchange="window.h.changeMonth(this.value)" class="bg-transparent text-xs font-bold text-slate-700 p-1 outline-none cursor-pointer">
                                ${monthOptions}
                            </select>
                        </div>
                    </div>
                </div>
                <div class="flex items-center gap-3">
                    <div class="hidden sm:block text-right">
                        <p class="text-sm font-bold text-slate-800 leading-tight">${state.appUser.name}</p>
                        <p class="text-xs text-slate-500 capitalize">${state.appUser.role}</p>
                    </div>
                    <div class="w-9 h-9 rounded-full bg-blue-100 text-blue-600 border border-blue-200 flex items-center justify-center font-bold">
                        ${state.appUser.name.charAt(0)}
                    </div>
                </div>
            `;
            lucide.createIcons();
        };

        const renderActiveTabContent = () => {
            const container = document.getElementById('main-content');
            if(!container) return;
            
            switch (state.activeTab) {
                case 'dashboard': renderDashboard(container); break;
                case 'master': renderDataMaster(container); break;
                case 'activity': renderDailyActivity(container); break;
                case 'pipeline': renderPipeline(container); break;
                case 'gps': renderGPS(container); break;
                case 'settings': renderSettings(container); break;
                default: renderDashboard(container);
            }
        };

        const renderDashboard = (container) => {
            const filteredSchools = getFilteredSchools();
            const filteredActivities = getFilteredActivities();
            const set = state.settings;

            const dbBaru = filteredSchools.length;
            const canvassingCount = filteredActivities.filter(a => a.type === 'Canvassing').length;
            const followUpCount = filteredActivities.filter(a => a.type === 'Follow Up').length;
            const presentasiCount = filteredActivities.filter(a => a.type === 'Presentasi').length;

            const pipelineState = {};
            filteredSchools.forEach(s => {
                const schoolActivities = filteredActivities.filter(a => a.schoolId === s.id);
                if (schoolActivities.length > 0) {
                    const latest = schoolActivities.reduce((prev, curr) => ((curr.timestamp || 0) > (prev.timestamp || 0)) ? curr : prev);
                    pipelineState[s.id] = { status: latest.type, dealValue: latest.dealValue || 0 };
                }
            });

            let dealCount = 0, belumDealCount = 0, omzet = 0;
            let funnelData = [
                { name: 'Database', value: filteredSchools.length, fill: '#94a3b8' },
                { name: 'Canvassing', value: 0, fill: '#3b82f6' },
                { name: 'Follow Up', value: 0, fill: '#8b5cf6' },
                { name: 'Presentasi', value: 0, fill: '#f59e0b' },
                { name: 'Deal', value: 0, fill: '#10b981' }
            ];

            const statusCounts = {};

            Object.values(pipelineState).forEach(st => {
                if (st.status === 'Deal') { dealCount++; omzet += Number(st.dealValue); }
                else if (st.status === 'Belum Deal') belumDealCount++;
                
                if (['Canvassing', 'Follow Up', 'Presentasi', 'Negosiasi', 'Deal', 'Belum Deal'].includes(st.status)) funnelData[1].value++;
                if (['Follow Up', 'Presentasi', 'Negosiasi', 'Deal', 'Belum Deal'].includes(st.status)) funnelData[2].value++;
                if (['Presentasi', 'Negosiasi', 'Deal', 'Belum Deal'].includes(st.status)) funnelData[3].value++;
                if (st.status === 'Deal') funnelData[4].value++;

                statusCounts[st.status] = (statusCounts[st.status] || 0) + 1;
            });

            const conversionRate = filteredSchools.length > 0 ? ((dealCount / filteredSchools.length) * 100).toFixed(1) : 0;

            const renderKpi = (title, val, target, icon, color, isCurrency=false, isPercent=false) => {
                let progress = 0; let statusColor = 'text-slate-500';
                if(target) {
                    progress = Math.min((val/target)*100, 100);
                    if(progress<50) statusColor='text-red-500';
                    else if(progress<100) statusColor='text-amber-500';
                    else statusColor='text-emerald-500';
                }
                const displayVal = isCurrency ? formatCurrency(val) : isPercent ? `${val}%` : val;
                
                return `
                <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm hover:shadow-md transition">
                    <div class="flex justify-between items-start">
                        <div>
                            <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">${title}</p>
                            <h3 class="text-2xl font-bold text-slate-800">${displayVal}</h3>
                        </div>
                        <div class="p-2.5 rounded-xl ${color} shadow-sm"><i data-lucide="${icon}" class="w-5 h-5 text-white"></i></div>
                    </div>
                    ${target ? `
                    <div class="mt-4">
                        <div class="flex justify-between text-xs mb-1">
                            <span class="text-slate-500 font-medium">Target: ${target}</span>
                            <span class="font-bold ${statusColor}">${progress.toFixed(0)}%</span>
                        </div>
                        <div class="w-full bg-slate-100 rounded-full h-1.5 overflow-hidden">
                            <div class="h-1.5 rounded-full transition-all duration-500 ${progress>=100?'bg-emerald-500':progress>=50?'bg-amber-400':'bg-red-500'}" style="width: ${progress}%"></div>
                        </div>
                    </div>` : ''}
                </div>`;
            };

            const activeProspectsHtml = Object.keys(statusCounts).length > 0 ? Object.entries(statusCounts).map(([status, count]) => `
                <div>
                    <div class="flex justify-between text-sm mb-1">
                        <span class="font-semibold text-slate-700">${status}</span>
                        <span class="text-slate-500 text-xs font-bold">${count} Sekolah</span>
                    </div>
                    <div class="w-full bg-slate-100 rounded-full h-2 overflow-hidden">
                        <div class="bg-blue-600 h-2 rounded-full transition-all duration-500" style="width: ${(count/Math.max(filteredSchools.length, 1))*100}%"></div>
                    </div>
                </div>
            `).join('') : '<div class="text-center text-slate-400 py-12 text-sm">Belum ada data aktivitas.</div>';

            container.innerHTML = `
            <div class="space-y-6">
                <div>
                    <h2 class="text-xl font-bold text-slate-800">Dashboard Monitoring Real-Time</h2>
                    <p class="text-slate-500 text-sm">Ringkasan kualitatif & kuantitatif performa penjualan.</p>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                    ${renderKpi('Database Baru', dbBaru, set.targetDatabase, 'database', 'bg-slate-700')}
                    ${renderKpi('Canvassing', canvassingCount, set.targetCanvassing, 'map-pin', 'bg-blue-600')}
                    ${renderKpi('Follow Up', followUpCount, set.targetFollowUp, 'users', 'bg-purple-600')}
                    ${renderKpi('Presentasi', presentasiCount, set.targetPresentasi, 'target', 'bg-amber-500')}
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                    ${renderKpi('Total Deal', dealCount, null, 'check', 'bg-emerald-600')}
                    ${renderKpi('Belum Deal', belumDealCount, null, 'x', 'bg-red-500')}
                    ${renderKpi('Omzet Tercipta', omzet, null, 'trending-up', 'bg-indigo-600', true, false)}
                    ${renderKpi('Conversion Rate', conversionRate, null, 'activity', 'bg-teal-600', false, true)}
                </div>
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                    <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">

        window.addEventListener('online', () => { state.isOnline = true; if(state.appUser) renderHeaderUI(); });
        window.addEventListener('offline', () => { state.isOnline = false; if(state.appUser) renderHeaderUI(); });

        // Initialize Application
        const initApp = async () => {
            try {
                if (typeof window.__initial_auth_token !== 'undefined' && window.__initial_auth_token) {
                    await signInWithCustomToken(auth, window.__initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (error) {
                console.error("Auth error:", error);
                window.h.showToast("Koneksi Firebase terhambat. Menggunakan mode lokal sementara.", "error");
                renderApp(); // Tetap render halaman login meski gagal konek
            }
        };

        onAuthStateChanged(auth, (user) => {
            state.firebaseUser = user;
            if (user) {
                setupRealtimeListeners();
            }
            renderApp(); // Initial render (akan render login via state lokal terlebih dahulu)
        });

        // Start!
        initApp();

    </script>
</body>
</html>
